# Load common config from ~/.config/tmux
source-file ~/.config/tmux/common.conf

# Mac-specific settings
# =====================

# アクティブなペインを目立たせる（common.confとは異なる配色）
set -g pane-active-border-style fg=colour255,bg=colour238

# Why: 明示 pbcopy だと common.conf の copy-command（copy-filter）を迂回する
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
