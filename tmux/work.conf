# ==============================================================================
# tmux 仕事環境固有設定 (mfs_work の後継)
# Mac環境ベース + 仕事向け追加機能
# ==============================================================================

# Mac設定を読み込み（common.conf も含まれる）
source-file ~/.config/tmux/common.conf

# ------------------------------------------------------------------------------
# 仕事環境固有: セッション切り替え
# ------------------------------------------------------------------------------
# Prefix + Tab で直前のセッションに切り替え
bind Tab switch-client -l

# Prefix + z でペインをズーム/解除
bind-key z resize-pane -Z

# Prefix + = でフォーカス中ペインの cwd を同一ウィンドウの全ペインへ伝播
# Why: Instead of restoring this in common.conf (9cccec7 の元の場所), adopted .tmux.conf. Reason: 依頼対象がこのファイル
# Why: Instead of keeping default choose-buffer on prefix =, adopted run-shell. Reason: cwd 伝播を = に割り当てる指定
bind = run-shell "~/.config/tmux/scripts/sync-panes-dir.sh '#{pane_current_path}' '#{window_id}' '#{pane_id}'"

# ------------------------------------------------------------------------------
# 仕事環境固有: 履歴設定
# ------------------------------------------------------------------------------
set-option -g history-limit 10000
